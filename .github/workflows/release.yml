name: release

# Publishes @metamynd/mcp-gateway to npm when a version tag (vX.Y.Z) is pushed.
#
# Authentication, in order:
#   1. npm trusted publishing (OIDC): no stored token, nothing to expire, provenance attached automatically. Set it up
#      once on npmjs.com → @metamynd/mcp-gateway → Settings → Trusted publishing: GitHub Actions, organization
#      "Metamynd", repository "metamynd-mcp-gateway", workflow "release.yml". npm only allows this once the package
#      exists, so the FIRST release uses (2).
#   2. NPM_TOKEN (or NPM) repository secret: a granular token with "Bypass 2FA", used only while the secret exists. Delete the
#      secret once trusted publishing is set up.
#
# Before publishing: the tag must equal package.json's version, the package must not be private, and typecheck + tests
# must pass on the exact commit being published.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    env:
      # A step's own env is not visible to its if:, so the choice is made here.
      HAS_TOKEN: ${{ (secrets.NPM_TOKEN || secrets.NPM) != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; pinned, like everything else.
      - run: npm install -g npm@11.20.0

      - name: The tag is the package's version, and the package is publishable
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          PRIVATE=$(node -p "Boolean(require('./package.json').private)")
          NAME=$(node -p "require('./package.json').name")
          [ "$TAG" = "$VERSION" ] || { echo "::error::tag v$TAG does not match package.json version $VERSION"; exit 1; }
          [ "$PRIVATE" = "false" ] || { echo "::error::package.json is still \"private\": true"; exit 1; }
          [ "$NAME" = "@metamynd/mcp-gateway" ] || { echo "::error::unexpected package name $NAME"; exit 1; }
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "::error::$NAME@$VERSION is already on npm"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: What will be published
        run: npm pack --dry-run 2>&1 | tee pack.txt && ! grep -E 'test/|\.github/|docs/|agent\.metamynd\.json|\.env' pack.txt

      - name: Publish (npm token, first release only)
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM }}
        run: npm publish --access public --provenance

      - name: Publish (trusted publishing)
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: npm publish --access public

      - name: Summary
        run: echo "Published @metamynd/mcp-gateway@${GITHUB_REF_NAME#v} — https://www.npmjs.com/package/@metamynd/mcp-gateway" >> "$GITHUB_STEP_SUMMARY"
