name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:types
      - run: npm test

  # docs/design.md §10: the same governed calls through real framework clients must get identical verdicts and run the
  # upstream the same number of times. Every client must be present here (CONFORMANCE_REQUIRE_ALL).
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @openai/agents@0.20.0
      - run: python -m pip install --disable-pip-version-check -r conformance/requirements.txt
      - run: npm run conformance
        env:
          CONFORMANCE_REQUIRE_ALL: '1'
          PYTHON: python