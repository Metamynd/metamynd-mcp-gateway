name: catalog

# Re-checks every catalog entry against its real, pinned MCP server (scripts/catalog-verify.mjs): on any change to the
# catalog or its tooling, and weekly — a published version is immutable on npm, but a deleted or yanked one is not.

on:
  pull_request:
    paths: ['catalog/**', 'scripts/catalog-*.mjs', 'src/catalog.mjs', 'src/schema-hash.mjs']
  push:
    branches: [main]
    paths: ['catalog/**', 'scripts/catalog-*.mjs', 'src/catalog.mjs', 'src/schema-hash.mjs']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run catalog:verify
